name: Smule
description: 'Smule is an American consumer music technology company whose flagship social
  singing and karaoke app lets people perform solos, duets, and group songs and collaborate
  with other singers around the world in real time. Launched on iOS in 2012 and on Android
  in 2013 under the name "Sing! Karaoke," the app grew to tens of millions of monthly active
  users. Smule Inc. is headquartered in San Francisco and is backed by Bessemer Venture
  Partners and Shasta Ventures. Smule publishes no official public developer API; this
  profile tracks the company for the API Evangelist network.'
